name: verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  python-and-release:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run public release tool tests
        run: python3 -m unittest evaluation/v2/tests/test_public_release.py
      - name: Run the complete research suite when the private vault is present
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "macOS" ]] && git rev-parse --verify --quiet 'contextlab-v1-raw-2026-06^{commit}' >/dev/null; then
            PYTHONPATH=evaluation/v2 python3 -m unittest discover -s evaluation/v2/tests -p 'test_*.py'
          else
            echo "The Mac-only private-vault suite is unavailable in this public Ubuntu checkout."
          fi
      - name: Reproduce or verify the public release
        shell: bash
        run: |
          if [[ -f results/v2/retrieval/public_component_lab.json ]]; then
            python3 scripts/public_release.py export --output "${RUNNER_TEMP}/contextlab-public"
            python3 scripts/public_release.py verify --bundle-root "${RUNNER_TEMP}/contextlab-public"
          else
            python3 scripts/public_release.py verify --bundle-root .
          fi

  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Verify the standalone public viewer
        shell: bash
        run: |
          viewer_root="${GITHUB_WORKSPACE}/viewer"
          if [[ -f results/v2/retrieval/public_component_lab.json ]]; then
            python3 scripts/public_release.py export --output "${RUNNER_TEMP}/contextlab-public"
            viewer_root="${RUNNER_TEMP}/contextlab-public/viewer"
          fi
          cd "${viewer_root}"
          npm ci
          npm run check
